services:
  - type: web
    name: decormimbre-backend
    env: python
    # El backend vive en esta subcarpeta del repo (no en la raíz).
    rootDir: decormimbre_backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migra la base de datos antes de cada despliegue (crea las tablas).
    preDeployCommand: python manage.py migrate --noinput
    # worker-class gevent: necesario para SSE (streaming). Sin él, cada conexión
    # SSE ocupa un worker síncrono completo y unas pocas agotan el servidor.
    startCommand: gunicorn config.wsgi:application --worker-class gevent --workers 2 --worker-connections 200 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: decormimbre-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: decormimbre-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://decormimbre-app.vercel.app

databases:
  - name: decormimbre-db
    databaseName: decormimbre
    user: decormimbre_user
    plan: free
