services:
  - type: web
    name: decormimbre-backend
    env: python
    # El backend vive en esta subcarpeta del repo (no en la raíz).
    rootDir: decormimbre_backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migra la base de datos antes de cada despliegue (crea las tablas).
    preDeployCommand: python manage.py migrate --noinput
    # Workers síncronos: gevent parchea los sockets y rompe la conexión SSL de
    # psycopg2 con Neon ("bad record mac"). Con SSE cada conexión ocupa un worker,
    # aceptable para este volumen. Si se necesita gevent, usar psycogreen.
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      # Base de datos externa en Neon (gratis, sin tarjeta). El valor se pega
      # en el dashboard de Render: la cadena de conexión de Neon.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: decormimbre-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://decormimbre-app.vercel.app
